services:
  mysql:
    image: mysql:8.4
    container_name: light-trace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: light_trace_dev
      MYSQL_DATABASE: light_trace
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - light_trace_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plight_trace_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  light_trace_mysql_data:
